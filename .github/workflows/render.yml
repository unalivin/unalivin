# Redraws the profile cards with fresh GitHub and LeetCode numbers every 30
# minutes. A source that fails keeps its last good values, so a flaky API never
# blanks a card.
name: Render profile
on:
   schedule:
      - cron: "11,41 * * * *"
   workflow_dispatch:
   push:
      branches: [main]
      paths:
         - scripts/**
         - profile.json
         - .github/workflows/render.yml

permissions:
   contents: write

concurrency:
   group: render-profile
   cancel-in-progress: false

jobs:
   render:
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
              python-version: "3.12"
         - name: Draw cards and README
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: python scripts/render.py
         - name: Commit changes
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add assets/svg README.md
              if ! git diff --cached --quiet; then
                 git commit -m "chore: refresh profile cards"
                 git pull --rebase --autostash origin main
                 git push
              fi
